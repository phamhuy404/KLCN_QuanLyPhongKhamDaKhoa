<!-- HEADER (Dành cho Cổng Bệnh Nhân) -->
<header class="bg-white border-b border-slate-200 sticky top-0 z-20 px-6 py-4 flex items-center justify-between shadow-sm">
    <div class="flex items-center gap-3">
        <!-- Nút menu mobile -->
        <button id="mobile-menu-btn" class="md:hidden w-9 h-9 rounded-xl bg-slate-100 flex items-center justify-center text-slate-600 hover:bg-slate-200 transition-all">
            <i class="fa-solid fa-bars"></i>
        </button>

        <div>
            <h2 class="text-lg sm:text-xl font-bold text-slate-800">Xin chào, Nguyễn Văn An! 👋</h2>
            <p class="text-xs text-slate-400">Mã bệnh nhân: <span class="font-semibold text-slate-700 bg-slate-100 px-2 py-0.5 rounded">BN00291</span></p>
        </div>
    </div>

    <!-- User profile & notifications -->
    <div class="flex items-center gap-3 sm:gap-4">
        <!-- Nút đặt lịch nhanh trên header -->
        <a href="{{ url_for('patient_booking') }}" class="hidden sm:flex items-center gap-2 px-3.5 py-2 rounded-xl bg-medical-50 text-medical-700 hover:bg-medical-100 text-xs font-semibold transition-all">
            <i class="fa-solid fa-calendar-plus"></i> Đặt lịch hẹn
        </a>

        <!-- Nút chuông thông báo -->
        <button class="w-10 h-10 rounded-xl bg-slate-100 hover:bg-slate-200 flex items-center justify-center text-slate-600 relative transition-all" title="Thông báo" onclick="showToast('Bạn có 1 thông báo nhắc lịch khám sắp tới!', 'info')">
            <i class="fa-regular fa-bell text-base"></i>
            <span class="absolute top-2.5 right-2.5 w-2 h-2 bg-rose-500 rounded-full ring-2 ring-white"></span>
        </button>

        <!-- Avatar & Tên bệnh nhân có link vào tài khoản -->
        <a href="{{ url_for('patient_profile') }}" class="flex items-center gap-3 pl-2 border-l border-slate-200 group">
            <img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&q=80&w=100" alt="Avatar" class="w-10 h-10 rounded-xl object-cover ring-2 ring-medical-500/30 group-hover:ring-medical-500 transition-all">
            <div class="hidden sm:block text-left">
                <h4 class="text-sm font-semibold text-slate-800 group-hover:text-medical-600 transition-colors leading-none">Nguyễn Văn An</h4>
                <span class="text-xs text-medical-600 mt-1 block font-medium">Hội viên Bạc</span>
            </div>
        </a>
    </div>
</header>
