<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký tài khoản - H2T Healthcare</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        medical: {
                            50: '#eefcf6',
                            100: '#d4f8e8',
                            500: '#10b981',
                            600: '#059669',
                            700: '#047857',
                            900: '#065f46',
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/custom.css') }}">
</head>
<body class="bg-slate-50 font-sans antialiased text-slate-800 min-h-screen flex items-center justify-center p-4 sm:p-6">

    <div class="max-w-2xl w-full bg-white rounded-3xl shadow-xl shadow-slate-200/50 border border-slate-100 overflow-hidden p-8 sm:p-10">
        
        <!-- Header -->
        <div class="flex items-center justify-between pb-6 border-b border-slate-100">
            <div class="flex items-center gap-3">
                <div class="w-11 h-11 rounded-2xl bg-medical-500 flex items-center justify-center text-white shadow-lg shadow-medical-500/20">
                    <i class="fa-solid fa-heart-pulse text-2xl"></i>
                </div>
                <div>
                    <h1 class="font-bold text-slate-900 text-lg">H2T Healthcare<span class="text-medical-500">+</span></h1>
                    <span class="text-xs text-slate-400">Đăng ký Hồ sơ Bệnh nhân Mới</span>
                </div>
            </div>
            <a href="{{ url_for('login') }}" class="text-xs text-medical-600 font-semibold hover:underline flex items-center gap-1">
                <i class="fa-solid fa-arrow-left"></i> Đăng nhập
            </a>
        </div>

        <div class="mt-6 mb-6">
            <h2 class="text-2xl font-bold text-slate-900">Tạo tài khoản khám bệnh</h2>
            <p class="text-slate-400 text-sm mt-1">Thông tin sẽ được đồng bộ trực tiếp vào cơ sở dữ liệu y tế của phòng khám.</p>
        </div>

        <!-- Registration Form -->
        <form action="{{ url_for('register') }}" method="POST" class="space-y-5">
            
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">Họ và tên <span class="text-rose-500">*</span></label>
                    <input type="text" required placeholder="Nguyễn Văn A"
                        class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-medical-500 focus:ring-2 focus:ring-medical-500/20 transition-all">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">Số điện thoại <span class="text-rose-500">*</span></label>
                    <input type="tel" required placeholder="0901234567"
                        class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-medical-500 focus:ring-2 focus:ring-medical-500/20 transition-all">
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">Ngày sinh <span class="text-rose-500">*</span></label>
                    <input type="date" required
                        class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-medical-500 focus:ring-2 focus:ring-medical-500/20 transition-all">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">Giới tính <span class="text-rose-500">*</span></label>
                    <select required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-medical-500 focus:ring-2 focus:ring-medical-500/20 transition-all text-slate-700">
                        <option value="">Chọn giới tính</option>
                        <option value="male">Nam</option>
                        <option value="female">Nữ</option>
                        <option value="other">Khác</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">Số CCCD / CMND <span class="text-rose-500">*</span></label>
                    <input type="text" required placeholder="00120100xxxx"
                        class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-medical-500 focus:ring-2 focus:ring-medical-500/20 transition-all">
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">Email (Không bắt buộc)</label>
                    <input type="email" placeholder="example@gmail.com"
                        class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-medical-500 focus:ring-2 focus:ring-medical-500/20 transition-all">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">Mã thẻ BHYT (Nếu có)</label>
                    <input type="text" placeholder="DN40101xxxxxxxx"
                        class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-medical-500 focus:ring-2 focus:ring-medical-500/20 transition-all">
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">Mật khẩu <span class="text-rose-500">*</span></label>
                    <input type="password" required placeholder="Tối thiểu 6 ký tự"
                        class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-medical-500 focus:ring-2 focus:ring-medical-500/20 transition-all">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">Xác nhận mật khẩu <span class="text-rose-500">*</span></label>
                    <input type="password" required placeholder="Nhập lại mật khẩu"
                        class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-medical-500 focus:ring-2 focus:ring-medical-500/20 transition-all">
                </div>
            </div>

            <div class="flex items-start gap-2.5 pt-2">
                <input type="checkbox" required id="agree" class="mt-1 w-4 h-4 rounded text-medical-600 border-slate-300 focus:ring-medical-500 cursor-pointer">
                <label for="agree" class="text-xs text-slate-500 leading-relaxed cursor-pointer">
                    Tôi xác nhận thông tin cung cấp là hoàn toàn chính xác và đồng ý với <a href="#" class="text-medical-600 font-medium underline">Điều khoản dịch vụ y tế & Bảo mật thông tin</a> của H2T Healthcare.
                </label>
            </div>

            <button type="submit" class="w-full py-3.5 px-4 bg-medical-600 hover:bg-medical-700 text-white font-bold rounded-xl shadow-lg shadow-medical-600/30 transition-all text-sm flex items-center justify-center gap-2 mt-4">
                <i class="fa-solid fa-user-plus"></i> Hoàn tất Đăng Ký Tài Khoản
            </button>
        </form>

        <div class="mt-6 text-center text-sm text-slate-500 border-t border-slate-100 pt-5">
            Đã có tài khoản khám bệnh? 
            <a href="{{ url_for('login') }}" class="font-semibold text-medical-600 hover:underline">Đăng nhập</a>
        </div>

    </div>

</body>
</html>
