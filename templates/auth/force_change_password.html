<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thiết lập mật khẩu mới - H2T Healthcare</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        try {
            const t = localStorage.getItem('h2t_theme') || localStorage.getItem('theme');
            if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        } catch(e) {}
    </script>
    <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        medical: {
                            50: '#eefcf6',
                            100: '#d4f8e8', 200: '#a7f3d0', 300: '#6ee7b7', 400: '#34d399',
                            500: '#10b981',
                            600: '#059669',
                            700: '#047857',
                            800: '#065f46', 900: '#064e3b',
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/custom.css') }}">
</head>
<body class="bg-slate-50 dark:bg-slate-900 font-sans antialiased text-slate-800 dark:text-slate-200 min-h-screen flex items-center justify-center p-4 sm:p-6 transition-colors duration-200">
    <div class="fixed top-5 right-5 z-50">
        <button type="button" onclick="toggleDarkMode()" 
                class="w-10 h-10 rounded-2xl bg-white/90 dark:bg-slate-800/90 hover:bg-white dark:hover:bg-slate-700 backdrop-blur-md shadow-md border border-slate-200 dark:border-slate-700 flex items-center justify-center text-slate-600 dark:text-amber-400 transition-all hover:scale-105" 
                title="Chuyển chế độ Giao diện Sáng / Tối">
            <i class="fa-solid fa-moon theme-toggle-icon text-sm"></i>
        </button>
    </div>

    <div class="max-w-md w-full bg-white dark:bg-slate-800 rounded-3xl shadow-xl shadow-slate-200/50 dark:shadow-slate-950/50 border border-slate-100 dark:border-slate-700 overflow-hidden p-6 sm:p-8 space-y-6">
        <div class="text-center space-y-2">
            <div class="w-14 h-14 mx-auto rounded-2xl bg-amber-50 dark:bg-amber-950/60 border border-amber-200 dark:border-amber-700/50 text-amber-600 dark:text-amber-400 flex items-center justify-center text-2xl shadow-sm">
                <i class="fa-solid fa-shield-halved"></i>
            </div>
            <h2 class="text-xl font-bold text-slate-900 dark:text-white">Thiết Lập Mật Khẩu Mới</h2>
            <p class="text-xs text-slate-500 dark:text-slate-400">
                Tài khoản <strong class="text-slate-800 dark:text-slate-200 font-mono">@{{ user.username }}</strong> vừa được cấp lại mật khẩu tạm thời. Vui lòng đặt mật khẩu mới để tiếp tục đăng nhập.
            </p>
        </div>

        {% if error %}
        <div class="p-3.5 rounded-xl bg-rose-50 dark:bg-rose-950/50 border border-rose-200 dark:border-rose-800 text-xs text-rose-700 dark:text-rose-300 flex items-center gap-2">
            <i class="fa-solid fa-circle-exclamation shrink-0"></i>
            <span>{{ error }}</span>
        </div>
        {% endif %}

        <div class="p-3 bg-amber-50 dark:bg-amber-950/40 border border-amber-200 dark:border-amber-800/60 rounded-xl text-xs text-amber-900 dark:text-amber-300 space-y-1">
            <div class="font-bold flex items-center gap-1.5">
                <i class="fa-solid fa-triangle-exclamation text-amber-600"></i> Quy định bảo mật bắt buộc
            </div>
            <p class="text-[11px] text-amber-800 dark:text-amber-400/90 leading-relaxed">
                Mật khẩu mới phải có tối thiểu 6 ký tự và khác mật khẩu tạm thời (123).
            </p>
        </div>

        <form method="POST" action="{{ url_for('auth.force_change_password') }}" class="space-y-4 text-xs">
            <div>
                <label class="block font-semibold text-slate-700 dark:text-slate-300 mb-1">Mật khẩu mới <span class="text-rose-500">*</span></label>
                <div class="relative">
                    <input type="password" name="new_password" id="new_password" required minlength="6" placeholder="Tối thiểu 6 ký tự"
                           class="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-900/60 border border-slate-200 dark:border-slate-700 rounded-xl focus:bg-white dark:focus:bg-slate-900 focus:outline-none focus:border-medical-500 text-slate-900 dark:text-white font-mono text-xs">
                    <button type="button" onclick="togglePwVisibility('new_password', this)" class="absolute right-3 top-2.5 text-slate-400 hover:text-slate-600">
                        <i class="fa-solid fa-eye text-xs"></i>
                    </button>
                </div>
            </div>

            <div>
                <label class="block font-semibold text-slate-700 dark:text-slate-300 mb-1">Xác nhận mật khẩu mới <span class="text-rose-500">*</span></label>
                <div class="relative">
                    <input type="password" name="confirm_password" id="confirm_password" required minlength="6" placeholder="Nhập lại mật khẩu mới"
                           class="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-900/60 border border-slate-200 dark:border-slate-700 rounded-xl focus:bg-white dark:focus:bg-slate-900 focus:outline-none focus:border-medical-500 text-slate-900 dark:text-white font-mono text-xs">
                    <button type="button" onclick="togglePwVisibility('confirm_password', this)" class="absolute right-3 top-2.5 text-slate-400 hover:text-slate-600">
                        <i class="fa-solid fa-eye text-xs"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="w-full py-2.5 bg-medical-600 hover:bg-medical-700 text-white font-bold rounded-xl shadow-md shadow-medical-600/20 flex items-center justify-center gap-2 transition-all">
                <i class="fa-solid fa-key"></i> Lưu Mật Khẩu và Đăng Nhập
            </button>
        </form>

        <div class="pt-2 text-center text-xs">
            <a href="{{ url_for('auth.logout') }}" class="text-slate-400 hover:text-rose-500 transition-colors">
                <i class="fa-solid fa-arrow-right-from-bracket mr-1"></i> Đăng xuất tài khoản
            </a>
        </div>
    </div>

    <script>
        function togglePwVisibility(inputId, btn) {
            const input = document.getElementById(inputId);
            const icon = btn.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.className = 'fa-solid fa-eye-slash text-xs text-medical-600';
            } else {
                input.type = 'password';
                icon.className = 'fa-solid fa-eye text-xs';
            }
        }
    </script>
</body>
</html>
