<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ error_code }} - {{ title }} | H2T Care</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        medical: {
                            50: '#f0fdfa',
                            100: '#ccfbf1',
                            500: '#14b8a6',
                            600: '#0d9488',
                            700: '#0f766e',
                            800: '#115e59',
                            900: '#134e4a',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-white rounded-3xl shadow-xl border border-slate-100 p-8 text-center space-y-6">
        <div class="inline-flex items-center justify-center w-20 h-20 rounded-2xl {% if error_code == 404 %}bg-amber-50 text-amber-500 border border-amber-200{% elif error_code == 403 %}bg-rose-50 text-rose-500 border border-rose-200{% else %}bg-slate-100 text-slate-600 border border-slate-200{% endif %} text-3xl">
            {% if error_code == 404 %}
                <i class="fa-solid fa-map-location-dot"></i>
            {% elif error_code == 403 %}
                <i class="fa-solid fa-shield-halved"></i>
            {% else %}
                <i class="fa-solid fa-triangle-exclamation"></i>
            {% endif %}
        </div>

        <div>
            <span class="inline-block px-3 py-1 text-xs font-bold font-mono uppercase tracking-wider rounded-full {% if error_code == 404 %}bg-amber-100 text-amber-700{% elif error_code == 403 %}bg-rose-100 text-rose-700{% else %}bg-slate-200 text-slate-700{% endif %}">
                Mã lỗi {{ error_code }}
            </span>
            <h1 class="text-xl font-black text-slate-900 mt-2">{{ title }}</h1>
            <p class="text-sm text-slate-500 mt-2 leading-relaxed">
                {{ message }}
            </p>
        </div>

        <div class="pt-2 flex flex-col sm:flex-row gap-3">
            <button type="button" onclick="window.history.back()" class="flex-1 py-3 px-4 rounded-xl border border-slate-200 bg-white hover:bg-slate-50 text-slate-700 text-sm font-bold transition-all flex items-center justify-center gap-2 cursor-pointer shadow-xs">
                <i class="fa-solid fa-arrow-left"></i>
                <span>Trang trước</span>
            </button>
            <a href="/" class="flex-1 py-3 px-4 rounded-xl bg-medical-600 hover:bg-medical-700 text-white text-sm font-bold transition-all flex items-center justify-center gap-2 shadow-md shadow-medical-600/20">
                <i class="fa-solid fa-house"></i>
                <span>Trang chủ</span>
            </a>
        </div>

        <div class="pt-4 border-t border-slate-100 text-xs text-slate-400">
            Hệ thống Quản lý Phòng khám Đa khoa H2T Care
        </div>
    </div>
</body>
</html>
