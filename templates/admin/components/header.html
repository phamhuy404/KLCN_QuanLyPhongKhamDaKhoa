<!-- HEADER (Dành cho Admin / Nhân viên phòng khám) -->
<header class="bg-white border-b border-slate-200 sticky top-0 z-20 px-6 py-4 flex items-center justify-between shadow-sm">
    <!-- Search Box -->
    <div class="flex items-center gap-4 w-96">
        <div class="relative w-full">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">
                <i class="fa-solid fa-magnifying-glass"></i>
            </span>
            <input type="text" placeholder="Tìm kiếm bệnh nhân (Mã BN, Tên, SĐT, CCCD)..." class="w-full pl-10 pr-4 py-2 bg-slate-100 border-none rounded-xl text-sm focus:ring-2 focus:ring-medical-500 transition-all outline-none">
        </div>
    </div>

    <!-- Quick Actions & Notifications -->
    <div class="flex items-center gap-4">
        <button class="bg-medical-600 hover:bg-medical-700 text-white px-4 py-2 rounded-xl text-sm font-medium shadow-lg shadow-medical-600/20 flex items-center gap-2 transition-all">
            <i class="fa-solid fa-plus"></i> Tiếp nhận bệnh nhân
        </button>
        
        <button class="w-10 h-10 rounded-xl bg-slate-100 hover:bg-slate-200 flex items-center justify-center text-slate-600 relative transition-all" title="Thông báo">
            <i class="fa-regular fa-bell"></i>
            <span class="absolute top-2 right-2 w-2.5 h-2.5 bg-rose-500 rounded-full ring-2 ring-white"></span>
        </button>

        <button class="w-10 h-10 rounded-xl bg-slate-100 hover:bg-slate-200 flex items-center justify-center text-slate-600 transition-all" title="Cài đặt">
            <i class="fa-solid fa-gear"></i>
        </button>
    </div>
</header>
