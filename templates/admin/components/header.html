<!-- Header dành cho phân hệ Quản trị & Y tế -->
<header class="bg-white border-b border-slate-200 sticky top-0 z-20 px-6 py-3.5 flex items-center justify-between shadow-sm">
    <div class="flex items-center gap-3">
        <!-- Nút menu mobile -->
        <button id="mobile-menu-btn" class="md:hidden w-9 h-9 rounded-xl bg-slate-100 flex items-center justify-center text-slate-600 hover:bg-slate-200 transition-all">
            <i class="fa-solid fa-bars"></i>
        </button>

        <!-- Search Box tìm kiếm bệnh nhân -->
        <form method="GET" action="{{ url_for('admin_patients') }}" class="hidden sm:flex items-center w-80 lg:w-96">
            <div class="relative w-full">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">
                    <i class="fa-solid fa-magnifying-glass text-xs"></i>
                </span>
                <input type="text" name="search" placeholder="Tìm bệnh nhân (Mã BN, Tên, SĐT, CCCD)..." 
                    class="w-full pl-10 pr-4 py-2 bg-slate-100 border border-transparent rounded-xl text-xs focus:bg-white focus:border-medical-500 focus:ring-2 focus:ring-medical-500/20 transition-all outline-none">
            </div>
        </form>
    </div>

    <!-- Quick Actions & User Identity -->
    <div class="flex items-center gap-3">
        <!-- Nút tiếp nhận bệnh nhân -->
        <a href="{{ url_for('admin_reception') }}" 
           class="bg-medical-600 hover:bg-medical-700 text-white px-3.5 py-2 rounded-xl text-xs font-bold shadow-md shadow-medical-600/20 flex items-center gap-1.5 transition-all" 
           title="Mở quầy tiếp nhận lễ tân">
            <i class="fa-solid fa-plus text-xs"></i>
            <span class="hidden sm:inline">Tiếp nhận mới</span>
        </a>

        <!-- Nút xem trang chủ -->
        <a href="{{ url_for('home') }}" 
           class="px-3 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-600 text-xs font-semibold transition-all flex items-center gap-1.5" 
           title="Xem Trang chủ phòng khám">
            <i class="fa-solid fa-house text-xs"></i>
            <span class="hidden lg:inline">Trang chủ</span>
        </a>

        <!-- Nút chuông thông báo -->
        <button type="button" class="w-9 h-9 rounded-xl bg-slate-100 hover:bg-slate-200 flex items-center justify-center text-slate-600 relative transition-all" title="Thông báo hệ thống" onclick="alert('Hệ thống hoạt động ổn định!')">
            <i class="fa-regular fa-bell text-sm"></i>
            <span class="absolute top-2 right-2 w-2 h-2 bg-medical-500 rounded-full ring-2 ring-white"></span>
        </button>

        <!-- Thông tin tài khoản nhân sự đăng nhập -->
        {% set curr_user = session.get('user', {}) %}
        <div class="flex items-center gap-2.5 pl-2.5 border-l border-slate-200">
            <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-medical-600 to-teal-500 text-white font-bold flex items-center justify-center text-xs shrink-0 shadow-sm">
                {{ (curr_user.get('ho_ten', 'AD'))[0] }}
            </div>
            <div class="hidden md:block text-left">
                <h4 class="text-xs font-bold text-slate-800 leading-tight truncate max-w-[140px]">{{ curr_user.get('ho_ten', 'Quản trị viên') }}</h4>
                <span class="text-[10px] text-teal-700 font-semibold block leading-tight">{{ curr_user.get('chuc_vu') or curr_user.get('ten_vai_tro', 'ADMIN') }}</span>
            </div>
            <a href="{{ url_for('logout') }}" 
               class="w-9 h-9 rounded-xl bg-slate-100 hover:bg-rose-50 text-slate-500 hover:text-rose-600 flex items-center justify-center transition-all ml-1" 
               title="Đăng xuất khỏi hệ thống">
                <i class="fa-solid fa-arrow-right-from-bracket text-xs"></i>
            </a>
        </div>
    </div>
</header>
